name: HermesConnect
options:
  bundleIdPrefix: io.mhinoverse
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: V8X3GYRTNK
    CODE_SIGN_STYLE: Automatic
packages:
  HermesKit:
    path: Packages/HermesKit
  MessageKit:
    url: https://github.com/MessageKit/MessageKit
    from: 5.0.0
  # Issue #44: Parakeet on Core ML (Apache-2.0). The model downloads only when the owner taps Download.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3
targets:
  HermesConnect:
    type: application
    platform: iOS
    sources: [HermesConnect]
    dependencies:
      - package: HermesKit
      - package: MessageKit
      - package: FluidAudio
    info:
      path: HermesConnect/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: Hermes records voice memos that you send to your agent.
        NSPhotoLibraryUsageDescription: Hermes attaches photos that you choose to your messages.
        NSCameraUsageDescription: Hermes uses the camera to take photos that you send to your agent.
        NSSpeechRecognitionUsageDescription: Hermes transcribes your voice memos and audio files on this iPhone.
        NSFaceIDUsageDescription: Hermes uses Face ID to unlock the app.
        NSLocationWhenInUseUsageDescription: Hermes sends your location to your own Hermes server so that your agent can answer location questions.
        NSLocationAlwaysAndWhenInUseUsageDescription: Hermes sends your location in the background, when you move a long distance or arrive at a place.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Issue #15: BGAppRefresh catch-up with local notifications (D5). No push entitlement.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.mhinoverse.hermesconnect.refresh]
        # Issue #45: reply notifications are communication notifications, so Siri can announce them.
        NSUserActivityTypes: [INSendMessageIntent]
    entitlements:
      path: HermesConnect/Resources/HermesConnect.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mhinoverse.hermesconnect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  HermesConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesConnectTests
      # Issue #42: the Ogg Opus reply fixture of the HermesKit tests, so the decode runs on iOS too.
      - path: Packages/HermesKit/Tests/HermesKitTests/Fixtures/voice-reply.ogg
        buildPhase: resources
    dependencies:
      - target: HermesConnect
schemes:
  HermesConnect:
    build:
      targets:
        HermesConnect: all
        HermesConnectTests: [test]
    test:
      targets: [HermesConnectTests]
