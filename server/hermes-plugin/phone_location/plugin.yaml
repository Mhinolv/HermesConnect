name: phone_location
label: Phone location (HermesConnect)
kind: standalone
version: 0.1.0
author: local
description: >
  One tool, phone_location: the last location fix that the owner's iPhone sent through the
  HermesConnect gate (~/.hermes/hermesconnect/location.json). If that fix is missing or older
  than 30 minutes, the tool uses the findmy plugin (findmy_location) when it is installed.
provides_tools:
  - phone_location
provides_hooks: []
