name: phone_location
label: Phone location (HermesConnect)
kind: standalone
version: 0.2.0
author: local
description: >
  One tool, phone_location: the last location fix that the owner's iPhone sent through the
  HermesConnect gate (~/.hermes/hermesconnect/location.json). A fix older than 30 minutes means
  "not moved" and comes back with its age and accuracy. If the fix is missing or not valid, the
  tool uses the findmy plugin (findmy_location) when it is installed.
provides_tools:
  - phone_location
provides_hooks: []
